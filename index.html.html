  const revenue = sales.reduce((a,s) => a + s.totalAmount, 0);
  const cogs = sales.reduce((a,s) => a + s.totalCost, 0);
  const profit = revenue - cogs;
  const expTotal = expenses.reduce((a,e) => a + Number(e.amount), 0);
  const net = profit - expTotal;
  const win = window.open('', '_blank', 'width=800,height=600');
  if (!win) { showToast('Please allow popups for PDF generation'); return; }
  win.document.write(`
    <html><head><title>M&D Report</title>
    <style>
      body { font-family: 'Inter', sans-serif; padding: 30px; background: white; color: #1f1420; }
      .header { background: #2d152b; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
      h1 { font-family: 'Cormorant Garamond', serif; margin: 0; }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin: 20px 0; }
      .stat { border: 1px solid #eee; padding: 14px; border-radius: 12px; text-align: center; }
      .stat .value { font-size: 24px; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; margin: 16px 0; }
      th { background: #f5f0f4; text-align: left; padding: 10px; }
      td { padding: 8px 10px; border-bottom: 1px solid #eee; }
      .t-right { text-align: right; }
      .footer { margin-top: 30px; color: #6a5a66; font-size: 13px; border-top: 1px solid #eee; padding-top: 16px; }
    </style>
    </head><body>
    <div class="header"><h1>${DB.settings.company}</h1><p style="opacity:0.8;">Sales Report · ${from} to ${to}</p></div>
    <div class="grid">
      <div class="stat"><div>Revenue</div><div class="value">${money(revenue)}</div></div>
      <div class="stat"><div>COGS</div><div class="value">${money(cogs)}</div></div>
      <div class="stat"><div>Gross Profit</div><div class="value" style="color:#d9a05b;">${money(profit)}</div></div>
      <div class="stat"><div>Net Profit</div><div class="value" style="color:${net>=0?'#d9a05b':'#d94b7a'};">${money(net)}</div></div>
    </div>
    <h3>Sales (${sales.length})</h3>
    ${sales.length ? `<table><tr><th>Date</th><th>Staff</th><th>Customer</th><th>Items</th><th class="t-right">Total</th></tr>${sales.map(s => `<tr><td>${s.timestamp.slice(0,10)}</td><td>${s.staffName || '—'}</td><td>${s.customer||'—'}</td><td>${s.items.map(i => `${i.name} ×${i.qty}`).join(', ')}</td><td class="t-right">${money(s.totalAmount)}</td></tr>`).join('')}</table>` : '<p>No sales in this period.</p>'}
    <h3>Expenses (${expenses.length})</h3>
    ${expenses.length ? `<table><tr><th>Date</th><th>Category</th><th>Note</th><th class="t-right">Amount</th></tr>${expenses.map(e => `<tr><td>${e.date}</td><td>${e.category}</td><td>${e.note||'—'}</td><td class="t-right">${money(e.amount)}</td></tr>`).join('')}</table>` : '<p>No expenses in this period.</p>'}
    <div class="footer">Generated by M&D Fragrances Tracker · ${new Date().toLocaleString()}</div>
    <script>
      window.onload = function() { window.print(); setTimeout(() => window.close(), 1000); }
    <\/script>
    </body></html>
  `);
  win.document.close();
}

function sharePDF(from, to) {
  const sales = DB.sales.filter(s => s.timestamp.slice(0,10) >= from && s.timestamp.slice(0,10) <= to);
  const expenses = DB.expenses.filter(e => e.date >= from && e.date <= to);
  const revenue = sales.reduce((a,s) => a + s.totalAmount, 0);
  const net = revenue - sales.reduce((a,s) => a + s.totalCost, 0) - expenses.reduce((a,e) => a + Number(e.amount), 0);
  const msg = `📊 *${DB.settings.company} Report*%0A📅 ${from} → ${to}%0A💰 Revenue: ${money(revenue)}%0A📉 Net Profit: ${money(net)}%0A📄 Full PDF available in the app.`;
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// ----- SETTINGS -----
function viewSettings() {
  const backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
  const staffList = [...DB.staff].sort((a,b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : a.name.localeCompare(b.name)));
  const me = currentUser();
  const lastExport = getLastExportDate();
  const daysAgo = daysSinceLastExport();

  return `
    <div class="card"><h2>⚙️ Settings</h2>
      <div class="field"><label>Company Name</label><input value="${state.settingsDraft.company}" oninput="state.settingsDraft.company=this.value"></div>
      <button class="btn" onclick="saveCompany()">Save</button>
    </div>

    <div class="card">
      <h3>👥 Staff Accounts</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Create a login for each person. Deactivating keeps their sales history.</p>
      ${staffList.map(s => `
        <div class="staff-card ${s.active ? '' : 'inactive'}">
          <div class="staff-avatar">${initials(s.name)}</div>
          <div class="staff-info">
            <div class="sname">
              ${s.name}
              ${s.role === 'owner' ? '<span class="pill gold">Owner</span>' : ''}
              ${s.id === me.id ? '<span class="pill green">You</span>' : ''}
              ${s.active ? '' : '<span class="pill grey">Inactive</span>'}
            </div>
            <div class="smeta">
              @${s.username} · password:
              ${state.revealPw[s.id]
                ? `<span class="pw-reveal">${s.password}</span> <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:12px;" onclick="toggleReveal('${s.id}')">Hide</button>`
                : `<button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:12px;" onclick="toggleReveal('${s.id}')">Reveal</button>`}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="openStaffModal('${s.id}')">✏️ Edit</button>
            ${s.role !== 'owner' ? `<button class="btn btn-sm ${s.active ? 'btn-rose' : 'btn-gold'}" onclick="toggleStaffActive('${s.id}')">${s.active ? 'Deactivate' : 'Activate'}</button>` : ''}
          </div>
        </div>
      `).join('')}
      <button class="btn" onclick="openStaffModal('new')" style="margin-top:8px;">+ Add Staff</button>
    </div>

    <div class="card">
      <h3>🗂️ Categories</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Rename a category to update it everywhere. Sales history keeps the old name.</p>
      ${DB.settings.categories.map(cat => {
        const count = DB.products.filter(p => p.category === cat).length;
        const isSystem = SYSTEM_CATEGORIES.includes(cat);
        return `
          <div class="cat-row">
            <div class="cat-name">
              ${cat}
              ${isSystem ? '<span class="pill gold">System</span>' : ''}
              ${!isSystem ? `<span class="pill grey">${count} product${count === 1 ? '' : 's'}</span>` : ''}
            </div>
            <div class="cat-actions">
              ${isSystem
                ? '<span style="font-size:12px;color:var(--ink-soft);">Protected</span>'
                : `
                  <button class="btn btn-sm btn-outline" onclick="openRenameCat('${cat.replace(/'/g, "\\'")}')">✏️ Rename</button>
                  <button class="btn btn-sm ${count === 0 ? 'btn-rose' : 'btn-disabled'}" onclick="${count === 0 ? `deleteCategory('${cat.replace(/'/g, "\\'")}')` : ''}" title="${count === 0 ? 'Delete' : 'Move products out first'}">🗑️</button>
                `}
            </div>
          </div>
        `;
      }).join('')}
      <div class="field-row" style="margin-top:16px;">
        <div class="field"><input placeholder="New category" value="${state.settingsDraft.newCat}" oninput="state.settingsDraft.newCat=this.value"></div>
        <button class="btn" onclick="addCategory()">Add</button>
      </div>
    </div>

    <div class="card"><h3>💾 Backups</h3>
      <div class="backup-meta">
        Last export: <b>${lastExport ? (daysAgo === 0 ? 'today' : daysAgo + ' day(s) ago') : 'never'}</b>
      </div>
      <p style="font-size:13px;color:var(--ink-soft);">Auto-backups saved daily (keep last 7 days).</p>
      ${backups.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${backups.slice().reverse().map(b => `<button class="btn btn-sm btn-outline" onclick="restoreBackup('${b.date}')">📅 ${b.date}</button>`).join('')}</div>` : '<p style="color:var(--ink-soft);">No auto-backups yet.</p>'}
      <button class="btn btn-sm btn-gold" onclick="exportData()" style="margin-top:8px;">📤 Export Data (Backup)</button>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('importFile').click();" style="margin-top:8px;">📥 Import Data</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-sm btn-outline" onclick="rebuildBottles()" style="margin-top:8px;">🔧 Rebuild Bottles</button>
    </div>
    <div class="card" style="border:2px solid var(--rose);"><h3 style="color:var(--rose);">Danger</h3><button class="btn btn-rose" onclick="resetAll()">🗑️ Erase All Data</button></div>
  `;
}

// ---------- CATEGORY RENAME / DELETE ----------
function openRenameCat(oldName) {
  state.showRenameCat = { oldName: oldName, newName: oldName };
  render();
}
function closeRenameCat() { state.showRenameCat = null; render(); }
function renameCatModal() {
  const r = state.showRenameCat;
  if (!r) return '';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeRenameCat();">
      <div class="modal" style="max-width:440px;">
        <button class="modal-close" onclick="closeRenameCat()">✕</button>
        <h3 style="font-family:'Cormorant Garamond',serif;">✏️ Rename Category</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Renaming updates the category name on all current products. Past sales keep the old name.</p>
        <div class="field"><label>Old name</label><input value="${r.oldName}" disabled style="opacity:0.6;"></div>
        <div class="field"><label>New name</label><input id="renameCatInput" value="${r.newName}" oninput="state.showRenameCat.newName=this.value" placeholder="Enter new name"></div>
        <button class="btn btn-block" onclick="submitRenameCat()">💾 Rename</button>
      </div>
    </div>
  `;
}
function submitRenameCat() {
  const r = state.showRenameCat;
  if (!r) return;
  const oldName = r.oldName;
  const newName = (r.newName || '').trim();
  if (!newName) { showToast('Enter a new name'); return; }
  if (newName === oldName) { closeRenameCat(); return; }
  if (SYSTEM_CATEGORIES.includes(oldName)) { showToast('System categories cannot be renamed'); return; }
  if (DB.settings.categories.includes(newName)) { showToast('A category with that name already exists'); return; }
  DB.settings.categories = DB.settings.categories.map(c => c === oldName ? newName : c);
  if (CATEGORY_DEFAULTS[oldName]) {
    CATEGORY_DEFAULTS[newName] = CATEGORY_DEFAULTS[oldName];
    delete CATEGORY_DEFAULTS[oldName];
  }
  DB.products.forEach(p => { if (p.category === oldName) p.category = newName; });
  saveDB();
  closeRenameCat();
  showToast('✅ Category renamed');
  render();
}

function deleteCategory(name) {
  if (SYSTEM_CATEGORIES.includes(name)) { showToast('System categories cannot be deleted'); return; }
  const count = DB.products.filter(p => p.category === name).length;
  if (count > 0) { showToast(`Move the ${count} product(s) out first`); return; }
  if (!confirm(`Delete the "${name}" category? This cannot be undone.`)) return;
  DB.settings.categories = DB.settings.categories.filter(c => c !== name);
  delete CATEGORY_DEFAULTS[name];
  saveDB();
  showToast('🗑️ Category deleted');
  render();
}

// ---------- STAFF ----------
function toggleReveal(id) { state.revealPw[id] = !state.revealPw[id]; render(); }

function openStaffModal(id) {
  if (id === 'new') {
    state.showStaffModal = { id: uid(), name: '', username: '', password: '', role: 'staff', active: true, isNew: true };
  } else {
    const s = DB.staff.find(x => x.id === id);
    state.showStaffModal = JSON.parse(JSON.stringify(s));
  }
  render();
}
function closeStaffModal() { state.showStaffModal = null; render(); }
function s_setField(f, v) { if (state.showStaffModal) state.showStaffModal[f] = v; }

function staffModal() {
  const s = state.showStaffModal;
  if (!s) return '';
  const isOwnerRec = s.role === 'owner';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeStaffModal();">
      <div class="modal" style="max-width:480px;">
        <button class="modal-close" onclick="closeStaffModal()">✕</button>
        <h3 style="font-family:'Cormorant Garamond',serif;">${s.isNew ? '➕ Add Staff' : '✏️ Edit Staff'}</h3>
        <div class="field"><label>Full name</label><input value="${s.name}" oninput="s_setField('name', this.value)" placeholder="e.g. Mary Wanjiku"></div>
        <div class="field"><label>Username</label><input value="${s.username}" oninput="s_setField('username', this.value)" placeholder="e.g. mary"></div>
        <div class="field"><label>Password</label><input value="${s.password}" oninput="s_setField('password', this.value)" placeholder="At least 4 characters"></div>
        <div class="field">
          <label>Role</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm ${s.role === 'staff' ? 'btn-gold' : 'btn-outline'}" ${isOwnerRec ? 'disabled style="opacity:0.5"' : ''} onclick="${isOwnerRec ? '' : "s_setField('role','staff');render();"}">Staff</button>
            <button class="btn btn-sm ${s.role === 'owner' ? 'btn-gold' : 'btn-outline'}" ${isOwnerRec ? 'disabled style="opacity:0.5"' : ''} onclick="${isOwnerRec ? '' : "s_setField('role','owner');render();"}">Owner</button>
          </div>
          ${isOwnerRec ? '<p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Owner role cannot be changed.</p>' : ''}
        </div>
        <button class="btn btn-block" onclick="saveStaff()">💾 Save</button>
      </div>
    </div>
  `;
}

function saveStaff() {
  const s = state.showStaffModal;
  if (!s) return;
  if (!s.name.trim()) { showToast('Please enter a name'); return; }
  if (!s.username.trim()) { showToast('Please enter a username'); return; }
  if (!s.password || s.password.length < 4) { showToast('Password must be at least 4 characters'); return; }
  const dupe = DB.staff.find(x => x.username.toLowerCase() === s.username.trim().toLowerCase() && x.id !== s.id);
  if (dupe) { showToast('That username is already taken'); return; }
  s.username = s.username.trim();
  s.name = s.name.trim();
  delete s.isNew;
  const idx = DB.staff.findIndex(x => x.id === s.id);
  if (idx >= 0) DB.staff[idx] = s; else DB.staff.push(s);
  saveDB();
  closeStaffModal();
  showToast('✅ Staff saved');
}

function toggleStaffActive(id) {
  const s = DB.staff.find(x => x.id === id);
  if (!s) return;
  if (s.role === 'owner') { showToast('Owner account cannot be deactivated'); return; }
  s.active = !s.active;
  saveDB();
  render();
  showToast(s.active ? '✅ Staff activated' : 'Staff deactivated');
}

function exportData() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mdf_backup_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setLastExportDate();
  state.backupPromptDismissed = true;
  showToast('✅ Backup saved');
  render();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.products && data.sales && data.expenses) {
        DB = data;
        if (!DB.staff) DB.staff = [];
        if (!DB.stockHistory) DB.stockHistory = [];
        ensureOwnerExists();
        migratePerfumeRefillsName();
        saveDB();
        showToast('✅ Data imported successfully');
        render();
      } else { showToast('❌ Invalid data file'); }
    } catch(err) { showToast('❌ Error reading file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function rebuildBottles() {
  if (!confirm('This will add any missing bottles. Existing bottles will not be duplicated. Continue?')) return;
  const added = ensureBottlesExist();
  if (added > 0) { saveDB(); showToast('✅ Added ' + added + ' missing bottles'); render(); }
  else showToast('✅ All bottles already exist');
}

function saveCompany() { DB.settings.company = state.settingsDraft.company || 'M&D Fragrances'; saveDB(); showToast('✅ Saved'); render(); }
function addCategory() { const c = state.settingsDraft.newCat.trim(); if (!c) return; if (DB.settings.categories.includes(c)) { showToast('Category already exists'); return; } DB.settings.categories.push(c); saveDB(); state.settingsDraft.newCat = ''; render(); showToast('✅ Category added'); }

function resetAll() { 
  if (confirm('⚠️ Erase ALL data? This cannot be undone.')) { 
    DB.products = []; DB.sales = []; DB.expenses = []; DB.stockHistory = [];
    DB.staff = [];
    ensureOwnerExists();
    setSession(null);
    saveDB(); 
    showToast('Data erased'); 
    render(); 
  } 
}

// ---------- HELPERS ----------
function showToast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; render(); }, 2500); }
function emptyState(icon, title, sub = '') { return `<div class="empty-state"><div class="icon">${icon}</div><div style="font-weight:700;">${title}</div><div style="color:var(--ink-soft);">${sub}</div></div>`; }

// init
render();
setupIdleWatcher();
</script>
</body>
</html>
